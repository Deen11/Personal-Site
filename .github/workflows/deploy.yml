name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the AWS stack exists and its outputs are saved as repository variables (see README)
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Hashed assets first, so new pages never point at files that aren't uploaded yet
      - name: Upload assets
        run: >
          aws s3 sync dist/_astro "s3://${{ vars.S3_BUCKET }}/_astro"
          --cache-control "public, max-age=31536000, immutable"
      - name: Upload pages
        run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --delete --exclude "_astro/*"
          --cache-control "public, max-age=0, must-revalidate"
      - name: Refresh CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
