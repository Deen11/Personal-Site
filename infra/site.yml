AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static hosting for the personal site: a private S3 bucket behind CloudFront with an HTTPS
  certificate, and a GitHub Actions role that can deploy it. DNS stays at Cloudflare.
  Deploy this stack in us-east-1 (CloudFront only accepts certificates from that region).

Parameters:
  DomainName:
    Type: String
    Default: eusuf.dev
    Description: Apex domain. www.<domain> redirects to it.
  GitHubRepo:
    Type: String
    Default: Deen11/personal-site
    Description: owner/repo allowed to deploy from its main branch.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this AWS account already has the token.actions.githubusercontent.com identity provider.
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_200 includes edge locations in Asia.

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      # Stack creation waits here until the two validation CNAMEs shown in ACM are added at Cloudflare
      ValidationMethod: DNS

  # Redirects www to the apex and maps clean URLs (/work) to Astro's /work/index.html files.
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-urls'
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect and index.html rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === 'www.${DomainName}') {
            var qs = Object.keys(request.querystring).map(function (k) {
              return k + '=' + request.querystring[k].value;
            }).join('&');
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + request.uri + (qs ? '?' + qs : '') } },
            };
          }
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed policies: CachingOptimized and SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        # Without list permission S3 answers 403 for missing keys, so both map to the site's 404 page
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Only workflows on the repo's main branch can assume this role, and only to upload the site.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'GitHub Actions deploy for ${GitHubRepo}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  CloudFrontDomain:
    Description: Point CNAME records for the domain and www at this, in Cloudflare
    Value: !GetAtt Distribution.DomainName
  S3Bucket:
    Description: GitHub variable S3_BUCKET
    Value: !Ref SiteBucket
  CloudFrontDistributionId:
    Description: GitHub variable CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  AwsRoleArn:
    Description: GitHub variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
